
<!doctype html>
<html lang="es">
  <head>
    <!-- Define la codificación de caracteres del documento -->
    <meta charset="UTF-8" />

    <!-- Establece el icono que aparece en la pestaña del navegador -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Adapta el diseño a diferentes tamaños de pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Define el título que aparece en la pestaña del navegador -->
    <title>MoraShop</title>

    <!-- Describe el contenido de la tienda para los motores de búsqueda -->
    <meta
      name="description"
      content="Tienda en línea de ejemplo: catálogo, carrito y proceso de compra."
    />
  </head>

  <body>
    <!-- Contenedor donde React renderiza toda la aplicación -->
    <div id="root"></div>

    <!-- Carga el punto de entrada de la aplicación React -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
